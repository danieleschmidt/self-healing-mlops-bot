# TERRAGON Self-Healing MLOps Bot - Production Deployment
version: '3.8'

services:
  terragon-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: terragon/self-healing-mlops-bot:latest
    container_name: terragon-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://terragon:${DB_PASSWORD}@terragon-db:5432/terragon_prod
      - REDIS_URL=redis://terragon-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - QUANTUM_ENABLED=true
      - AUTONOMOUS_MODE=true
    ports:
      - "8080:8080"
    depends_on:
      - terragon-db
      - terragon-redis
    volumes:
      - ./logs/production:/app/logs
      - ./security/certificates:/app/certs:ro
    networks:
      - terragon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
  
  terragon-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: terragon/self-healing-mlops-bot:latest
    container_name: terragon-worker
    restart: unless-stopped
    command: ["python", "-m", "celery", "worker", "-A", "self_healing_bot.tasks", "-l", "info"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://terragon:${DB_PASSWORD}@terragon-db:5432/terragon_prod
      - REDIS_URL=redis://terragon-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - QUANTUM_ENABLED=true
      - AUTONOMOUS_MODE=true
    depends_on:
      - terragon-db
      - terragon-redis
    volumes:
      - ./logs/production:/app/logs
    networks:
      - terragon-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
  
  terragon-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: terragon/self-healing-mlops-bot:latest
    container_name: terragon-scheduler
    restart: unless-stopped
    command: ["python", "-m", "celery", "beat", "-A", "self_healing_bot.tasks", "-l", "info"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://terragon:${DB_PASSWORD}@terragon-db:5432/terragon_prod
      - REDIS_URL=redis://terragon-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - terragon-db
      - terragon-redis
    volumes:
      - ./logs/production:/app/logs
    networks:
      - terragon-network
  
  terragon-db:
    image: postgres:15-alpine
    container_name: terragon-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=terragon_prod
      - POSTGRES_USER=terragon
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/database:/backups
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - terragon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terragon -d terragon_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  terragon-redis:
    image: redis:7-alpine
    container_name: terragon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - terragon-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  
  nginx:
    image: nginx:alpine
    container_name: terragon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./security/certificates:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - terragon-api
    networks:
      - terragon-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  prometheus:
    image: prom/prometheus:latest
    container_name: terragon-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terragon-network
  
  grafana:
    image: grafana/grafana:latest
    container_name: terragon-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - terragon-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  terragon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
