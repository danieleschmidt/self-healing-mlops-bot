# TERRAGON Autonomous SDLC v4.0 - Production Deployment Configuration\n# Production-Grade MLOps Bot Deployment\n\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: mlops-bot-config\n  namespace: mlops-production\ndata:\n  # Application Configuration\n  APP_NAME: \"terragon-mlops-bot\"\n  APP_VERSION: \"4.0.0\"\n  ENVIRONMENT: \"production\"\n  LOG_LEVEL: \"INFO\"\n  \n  # GitHub App Configuration\n  GITHUB_APP_ID: \"${GITHUB_APP_ID}\"\n  GITHUB_WEBHOOK_SECRET: \"${GITHUB_WEBHOOK_SECRET}\"\n  \n  # Database Configuration\n  DATABASE_URL: \"postgresql://mlops-bot:${DB_PASSWORD}@postgres-service:5432/mlops_bot_prod\"\n  DATABASE_POOL_SIZE: \"20\"\n  DATABASE_MAX_OVERFLOW: \"30\"\n  DATABASE_TIMEOUT: \"30\"\n  \n  # Redis Configuration\n  REDIS_URL: \"redis://redis-service:6379/0\"\n  REDIS_POOL_SIZE: \"10\"\n  REDIS_TIMEOUT: \"5\"\n  \n  # Celery Configuration\n  CELERY_BROKER_URL: \"redis://redis-service:6379/1\"\n  CELERY_RESULT_BACKEND: \"redis://redis-service:6379/2\"\n  CELERY_WORKERS: \"4\"\n  \n  # Performance Configuration\n  MAX_WORKERS: \"20\"\n  REQUEST_TIMEOUT: \"30\"\n  MAX_CONCURRENT_REQUESTS: \"1000\"\n  \n  # Scaling Configuration\n  AUTO_SCALING_ENABLED: \"true\"\n  MIN_REPLICAS: \"3\"\n  MAX_REPLICAS: \"100\"\n  TARGET_CPU_UTILIZATION: \"70\"\n  TARGET_MEMORY_UTILIZATION: \"80\"\n  \n  # Security Configuration\n  SECURITY_ENABLED: \"true\"\n  RATE_LIMITING_ENABLED: \"true\"\n  RATE_LIMIT_PER_MINUTE: \"100\"\n  CORS_ENABLED: \"true\"\n  \n  # Monitoring Configuration\n  METRICS_ENABLED: \"true\"\n  PROMETHEUS_PORT: \"9090\"\n  HEALTH_CHECK_INTERVAL: \"30\"\n  \n  # Feature Flags\n  QUANTUM_OPTIMIZATION_ENABLED: \"true\"\n  AUTONOMOUS_HEALING_ENABLED: \"true\"\n  ADVANCED_ANALYTICS_ENABLED: \"true\"\n  RESEARCH_MODE_ENABLED: \"false\"\n\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: mlops-bot-deployment\n  namespace: mlops-production\n  labels:\n    app: mlops-bot\n    version: v4.0\n    tier: production\nspec:\n  replicas: 3\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 25%\n      maxSurge: 25%\n  selector:\n    matchLabels:\n      app: mlops-bot\n  template:\n    metadata:\n      labels:\n        app: mlops-bot\n        version: v4.0\n      annotations:\n        prometheus.io/scrape: \"true\"\n        prometheus.io/port: \"9090\"\n        prometheus.io/path: \"/metrics\"\n    spec:\n      serviceAccountName: mlops-bot-sa\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        runAsGroup: 1000\n        fsGroup: 1000\n      containers:\n      - name: mlops-bot\n        image: terragon/mlops-bot:4.0.0\n        imagePullPolicy: Always\n        ports:\n        - containerPort: 8080\n          name: http\n          protocol: TCP\n        - containerPort: 9090\n          name: metrics\n          protocol: TCP\n        env:\n        - name: POD_NAME\n          valueFrom:\n            fieldRef:\n              fieldPath: metadata.name\n        - name: POD_NAMESPACE\n          valueFrom:\n            fieldRef:\n              fieldPath: metadata.namespace\n        - name: NODE_NAME\n          valueFrom:\n            fieldRef:\n              fieldPath: spec.nodeName\n        envFrom:\n        - configMapRef:\n            name: mlops-bot-config\n        - secretRef:\n            name: mlops-bot-secrets\n        resources:\n          requests:\n            memory: \"1Gi\"\n            cpu: \"500m\"\n          limits:\n            memory: \"4Gi\"\n            cpu: \"2000m\"\n        livenessProbe:\n          httpGet:\n            path: /health\n            port: 8080\n          initialDelaySeconds: 30\n          periodSeconds: 10\n          timeoutSeconds: 5\n          failureThreshold: 3\n        readinessProbe:\n          httpGet:\n            path: /ready\n            port: 8080\n          initialDelaySeconds: 15\n          periodSeconds: 5\n          timeoutSeconds: 3\n          failureThreshold: 3\n        startupProbe:\n          httpGet:\n            path: /health\n            port: 8080\n          initialDelaySeconds: 10\n          periodSeconds: 10\n          timeoutSeconds: 5\n          failureThreshold: 30\n        volumeMounts:\n        - name: github-private-key\n          mountPath: /secrets/github\n          readOnly: true\n        - name: logs\n          mountPath: /app/logs\n        - name: temp\n          mountPath: /tmp\n      - name: metrics-exporter\n        image: prom/node-exporter:latest\n        args:\n        - '--path.rootfs=/host'\n        - '--collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+)($|/)'\n        - '--collector.filesystem.ignored-fs-types=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'\n        ports:\n        - containerPort: 9100\n          name: node-metrics\n        resources:\n          requests:\n            memory: \"64Mi\"\n            cpu: \"50m\"\n          limits:\n            memory: \"128Mi\"\n            cpu: \"100m\"\n        volumeMounts:\n        - name: proc\n          mountPath: /host/proc\n          readOnly: true\n        - name: sys\n          mountPath: /host/sys\n          readOnly: true\n      volumes:\n      - name: github-private-key\n        secret:\n          secretName: github-app-private-key\n          defaultMode: 0400\n      - name: logs\n        emptyDir: {}\n      - name: temp\n        emptyDir: {}\n      - name: proc\n        hostPath:\n          path: /proc\n      - name: sys\n        hostPath:\n          path: /sys\n      affinity:\n        podAntiAffinity:\n          preferredDuringSchedulingIgnoredDuringExecution:\n          - weight: 100\n            podAffinityTerm:\n              labelSelector:\n                matchExpressions:\n                - key: app\n                  operator: In\n                  values:\n                  - mlops-bot\n              topologyKey: kubernetes.io/hostname\n      tolerations:\n      - key: \"node.kubernetes.io/not-ready\"\n        operator: \"Exists\"\n        effect: \"NoExecute\"\n        tolerationSeconds: 300\n      - key: \"node.kubernetes.io/unreachable\"\n        operator: \"Exists\"\n        effect: \"NoExecute\"\n        tolerationSeconds: 300\n\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: mlops-bot-service\n  namespace: mlops-production\n  labels:\n    app: mlops-bot\n  annotations:\n    prometheus.io/scrape: \"true\"\n    prometheus.io/port: \"9090\"\nspec:\n  type: ClusterIP\n  ports:\n  - port: 80\n    targetPort: 8080\n    protocol: TCP\n    name: http\n  - port: 9090\n    targetPort: 9090\n    protocol: TCP\n    name: metrics\n  - port: 9100\n    targetPort: 9100\n    protocol: TCP\n    name: node-metrics\n  selector:\n    app: mlops-bot\n\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: mlops-bot-hpa\n  namespace: mlops-production\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: mlops-bot-deployment\n  minReplicas: 3\n  maxReplicas: 100\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n  - type: Resource\n    resource:\n      name: memory\n      target:\n        type: Utilization\n        averageUtilization: 80\n  - type: Pods\n    pods:\n      metric:\n        name: requests_per_second\n      target:\n        type: AverageValue\n        averageValue: \"100\"\n  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 300\n      policies:\n      - type: Percent\n        value: 50\n        periodSeconds: 60\n      - type: Pods\n        value: 2\n        periodSeconds: 60\n    scaleUp:\n      stabilizationWindowSeconds: 60\n      policies:\n      - type: Percent\n        value: 100\n        periodSeconds: 15\n      - type: Pods\n        value: 4\n        periodSeconds: 15\n\n---\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: mlops-bot-pdb\n  namespace: mlops-production\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: mlops-bot\n\n---\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: mlops-bot-ingress\n  namespace: mlops-production\n  annotations:\n    kubernetes.io/ingress.class: \"nginx\"\n    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/force-ssl-redirect: \"true\"\n    nginx.ingress.kubernetes.io/backend-protocol: \"HTTP\"\n    nginx.ingress.kubernetes.io/rate-limit: \"100\"\n    nginx.ingress.kubernetes.io/rate-limit-window: \"1m\"\n    cert-manager.io/cluster-issuer: \"letsencrypt-prod\"\n    nginx.ingress.kubernetes.io/configuration-snippet: |\n      add_header X-Content-Type-Options nosniff;\n      add_header X-Frame-Options DENY;\n      add_header X-XSS-Protection \"1; mode=block\";\n      add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n      add_header Referrer-Policy \"strict-origin-when-cross-origin\";\nspec:\n  tls:\n  - hosts:\n    - mlops-bot.terragonlabs.com\n    secretName: mlops-bot-tls\n  rules:\n  - host: mlops-bot.terragonlabs.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: mlops-bot-service\n            port:\n              number: 80\n\n---\n# PostgreSQL Database\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: postgres\n  namespace: mlops-production\nspec:\n  serviceName: postgres-service\n  replicas: 1\n  selector:\n    matchLabels:\n      app: postgres\n  template:\n    metadata:\n      labels:\n        app: postgres\n    spec:\n      containers:\n      - name: postgres\n        image: postgres:15-alpine\n        ports:\n        - containerPort: 5432\n        env:\n        - name: POSTGRES_DB\n          value: \"mlops_bot_prod\"\n        - name: POSTGRES_USER\n          value: \"mlops-bot\"\n        - name: POSTGRES_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: postgres-secret\n              key: password\n        - name: PGDATA\n          value: \"/var/lib/postgresql/data/pgdata\"\n        resources:\n          requests:\n            memory: \"1Gi\"\n            cpu: \"500m\"\n          limits:\n            memory: \"4Gi\"\n            cpu: \"2000m\"\n        volumeMounts:\n        - name: postgres-storage\n          mountPath: /var/lib/postgresql/data\n        livenessProbe:\n          exec:\n            command:\n            - pg_isready\n            - -U\n            - mlops-bot\n          initialDelaySeconds: 30\n          periodSeconds: 10\n        readinessProbe:\n          exec:\n            command:\n            - pg_isready\n            - -U\n            - mlops-bot\n          initialDelaySeconds: 5\n          periodSeconds: 5\n  volumeClaimTemplates:\n  - metadata:\n      name: postgres-storage\n    spec:\n      accessModes: [\"ReadWriteOnce\"]\n      resources:\n        requests:\n          storage: 100Gi\n      storageClassName: fast-ssd\n\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: postgres-service\n  namespace: mlops-production\nspec:\n  selector:\n    app: postgres\n  ports:\n  - port: 5432\n    targetPort: 5432\n  clusterIP: None\n\n---\n# Redis Cache\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: redis\n  namespace: mlops-production\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: redis\n  template:\n    metadata:\n      labels:\n        app: redis\n    spec:\n      containers:\n      - name: redis\n        image: redis:7-alpine\n        ports:\n        - containerPort: 6379\n        args:\n        - redis-server\n        - --appendonly\n        - \"yes\"\n        - --maxmemory\n        - \"1gb\"\n        - --maxmemory-policy\n        - \"allkeys-lru\"\n        resources:\n          requests:\n            memory: \"512Mi\"\n            cpu: \"250m\"\n          limits:\n            memory: \"2Gi\"\n            cpu: \"1000m\"\n        volumeMounts:\n        - name: redis-storage\n          mountPath: /data\n        livenessProbe:\n          tcpSocket:\n            port: 6379\n          initialDelaySeconds: 30\n          periodSeconds: 10\n        readinessProbe:\n          exec:\n            command:\n            - redis-cli\n            - ping\n          initialDelaySeconds: 5\n          periodSeconds: 5\n      volumes:\n      - name: redis-storage\n        persistentVolumeClaim:\n          claimName: redis-pvc\n\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: redis-service\n  namespace: mlops-production\nspec:\n  selector:\n    app: redis\n  ports:\n  - port: 6379\n    targetPort: 6379\n\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: redis-pvc\n  namespace: mlops-production\nspec:\n  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage: 20Gi\n  storageClassName: fast-ssd\n\n---\n# Service Account with proper RBAC\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: mlops-bot-sa\n  namespace: mlops-production\n\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: mlops-bot-role\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\", \"services\", \"endpoints\", \"configmaps\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n- apiGroups: [\"apps\"]\n  resources: [\"deployments\", \"replicasets\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n- apiGroups: [\"autoscaling\"]\n  resources: [\"horizontalpodautoscalers\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n- apiGroups: [\"metrics.k8s.io\"]\n  resources: [\"pods\", \"nodes\"]\n  verbs: [\"get\", \"list\"]\n\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: mlops-bot-binding\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: mlops-bot-role\nsubjects:\n- kind: ServiceAccount\n  name: mlops-bot-sa\n  namespace: mlops-production\n\n---\n# Monitoring and Observability\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  name: mlops-bot-monitor\n  namespace: mlops-production\n  labels:\n    app: mlops-bot\nspec:\n  selector:\n    matchLabels:\n      app: mlops-bot\n  endpoints:\n  - port: metrics\n    path: /metrics\n    interval: 30s\n    scrapeTimeout: 10s\n  - port: node-metrics\n    path: /metrics\n    interval: 30s\n    scrapeTimeout: 10s\n\n---\n# Network Policies for Security\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: mlops-bot-network-policy\n  namespace: mlops-production\nspec:\n  podSelector:\n    matchLabels:\n      app: mlops-bot\n  policyTypes:\n  - Ingress\n  - Egress\n  ingress:\n  - from:\n    - namespaceSelector:\n        matchLabels:\n          name: ingress-nginx\n    - namespaceSelector:\n        matchLabels:\n          name: monitoring\n    ports:\n    - protocol: TCP\n      port: 8080\n    - protocol: TCP\n      port: 9090\n  egress:\n  - to:\n    - podSelector:\n        matchLabels:\n          app: postgres\n    ports:\n    - protocol: TCP\n      port: 5432\n  - to:\n    - podSelector:\n        matchLabels:\n          app: redis\n    ports:\n    - protocol: TCP\n      port: 6379\n  - to: []  # Allow all external traffic\n    ports:\n    - protocol: TCP\n      port: 443\n    - protocol: TCP\n      port: 80\n    - protocol: UDP\n      port: 53\n