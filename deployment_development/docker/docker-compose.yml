version: '3.8'

services:
  app:
    build: .
    container_name: self-healing-mlops-bot-dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - mlops-dev-network

  redis:
    image: redis:7-alpine
    container_name: mlops-redis-dev
    ports:
      - "6379:6379"
    networks:
      - mlops-dev-network

networks:
  mlops-dev-network:
    driver: bridge
