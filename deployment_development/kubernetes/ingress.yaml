apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: self-healing-mlops-bot
  namespace: self-healing-mlops-development
  labels:
    app: self-healing-mlops-bot
    environment: development
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - mlops-bot-development.terragonlabs.com
    secretName: self-healing-mlops-bot-tls
  rules:
  - host: mlops-bot-development.terragonlabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: self-healing-mlops-bot
            port:
              number: 80
---