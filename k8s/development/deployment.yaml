{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "terragon-mlops-bot",
    "namespace": "terragon-development",
    "labels": {
      "app": "terragon-mlops-bot",
      "environment": "development"
    }
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "terragon-mlops-bot"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "terragon-mlops-bot",
          "environment": "development"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "terragon-mlops-bot",
            "image": "terragon/self-healing-mlops-bot:latest",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "env": [
              {
                "name": "ENVIRONMENT",
                "value": "development"
              },
              {
                "name": "LOG_LEVEL",
                "value": "INFO"
              }
            ],
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 10
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/ready",
                "port": 8080
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5
            }
          }
        ]
      }
    }
  }
}