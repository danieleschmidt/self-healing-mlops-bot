# TERRAGON Alert Rules
groups:
  - name: terragon.rules
    rules:
    
    # High error rate
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value }} errors per second"
    
    # High response time
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High response time detected"
        description: "95th percentile response time is {{ $value }}s"
    
    # High CPU usage
    - alert: HighCPUUsage
      expr: rate(cpu_usage_total[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "CPU usage is {{ $value }}%"
    
    # High memory usage
    - alert: HighMemoryUsage
      expr: memory_usage_percent > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Memory usage is {{ $value }}%"
    
    # Database connection issues
    - alert: DatabaseConnectionFailed
      expr: up{job="postgres"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Database connection failed"
        description: "Cannot connect to PostgreSQL database"
    
    # Redis connection issues
    - alert: RedisConnectionFailed
      expr: up{job="redis"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis connection failed"
        description: "Cannot connect to Redis cache"
    
    # Low disk space
    - alert: LowDiskSpace
      expr: disk_free_percent < 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Low disk space"
        description: "Disk space is {{ $value }}% full"
    
    # Service down
    - alert: ServiceDown
      expr: up{job="terragon-api"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "TERRAGON API service is down"
        description: "The main API service is not responding"
    
    # Quantum system alerts
    - alert: QuantumCoherenceLoss
      expr: quantum_coherence_score < 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Quantum coherence degradation"
        description: "Quantum coherence score is {{ $value }}"
    
    # Autonomous system alerts
    - alert: AutonomousSystemFailure
      expr: autonomous_actions_failed_rate > 0.2
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Autonomous system failure rate high"
        description: "{{ $value }} of autonomous actions are failing"
