# TERRAGON Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'terragon-api'
    static_configs:
      - targets: ['terragon-api:8080']
    metrics_path: /metrics
    scrape_interval: 30s
    
  - job_name: 'terragon-worker'
    static_configs:
      - targets: ['terragon-worker:9090']
    scrape_interval: 30s
    
  - job_name: 'postgres'
    static_configs:
      - targets: ['terragon-db:9187']
    scrape_interval: 60s
    
  - job_name: 'redis'
    static_configs:
      - targets: ['terragon-redis:9121']
    scrape_interval: 30s
    
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 30s
    
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 60s
