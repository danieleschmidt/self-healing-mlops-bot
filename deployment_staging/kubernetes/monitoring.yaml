apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: self-healing-mlops-bot
  namespace: self-healing-mlops-staging
  labels:
    app: self-healing-mlops-bot
    environment: staging
spec:
  selector:
    matchLabels:
      app: self-healing-mlops-bot
      environment: staging
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-mlops-alerts
  namespace: self-healing-mlops-staging
  labels:
    app: self-healing-mlops-bot
    environment: staging
data:
  alerts.yml: |
    groups:
    - name: self-healing-mlops-bot
      rules:
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{container="self-healing-mlops-bot"} / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{container="self-healing-mlops-bot"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{container="self-healing-mlops-bot"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod is crash looping"
---