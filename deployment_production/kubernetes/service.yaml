apiVersion: v1
kind: Service
metadata:
  name: self-healing-mlops-bot
  namespace: self-healing-mlops-production
  labels:
    app: self-healing-mlops-bot
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 8090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: self-healing-mlops-bot
    environment: production
---